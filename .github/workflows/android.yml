
name: Build Eagle Education APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o EAGLE_EDUCATION_ANDROID_STUDIO_PROJECT.zip -d extracted

      - name: Check Android Project
        run: |
          find extracted -maxdepth 4 -type f | head -100
          find extracted -name gradlew -o -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          cd extracted/EagleEducationAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EAGLE-EDUCATION-APK
          path: extracted/EagleEducationAndroid/app/build/outputs/apk/debug/app-debug.apk
