
name: Build Eagle Education APK

on:
  workflow_dispatch:
  push:
    branches: [main]
longing concurrency:
  owner and id password 
jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools live classes and video and short notes upload tu owner 
          
      - name: Install SDK Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o EAGLE_EDUCATION_ANDROID_STUDIO_PROJECT.zip -d extracted

      - name: Check Android Project
        run: |
          find extracted -maxdepth 4 -type f | head -100
          find extracted -name gradlew -o -name build.gradle -o -name build.gradle.kts
      - name: Build APK
        run: |
          cd extracted/EagleEducationAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EAGLE-EDUCATION-APK
          path: extracted/EagleEducationAndroid/app/build/outputs/apk/debug/app-debug.apk
owner permissions: id password change env:
  and students pennal 
private final WebChromeClient webChromeClient = new WebChromeClient() {
    @Override
    public boolean onShowFileChooser(
            WebView webView,
            ValueCallback<Uri[]> filePathCallback,
            FileChooserParams fileChooserParams) {

        if (MainActivity.this.filePathCallback != null) {
            MainActivity.this.filePathCallback.onReceiveValue(null);
        }

        MainActivity.this.filePathCallback = filePathCallback;

        Intent intent = fileChooserParams.createIntent();
        intent.addCategory(Intent.CATEGORY_OPENABLE);
        intent.setType("video/*");

        try {
            startActivityForResult(intent, 1001);
        } catch (Exception e) {
            MainActivity.this.filePathCallback = null;
            return false;
        }
        return true;
    }
};

@Override
protected void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    getWindow().setStatusBarColor(Color.rgb(9, 38, 79));
    getWindow().setNavigationBarColor(Color.rgb(9, 38, 79));

    webView = new WebView(this);
    webView.setBackgroundColor(Color.rgb(243, 246, 251));

    WebSettings settings = webView.getSettings();
    settings.setJavaScriptEnabled(true);
    settings.setDomStorageEnabled(true);
    settings.setAllowFileAccess(true);
    settings.setAllowContentAccess(true);
    settings.setMediaPlaybackRequiresUserGesture(true);

    webView.setWebViewClient(new WebViewClient());
    webView.setWebChromeClient(webChromeClient);

    setContentView(webView);
    webView.loadUrl("file:///android_asset/index.html");
}

@Override
protected void onActivityResult(int requestCode, int resultCode, Intent data) {
    super.onActivityResult(requestCode, resultCode, data);

    if (requestCode == 1001 && filePathCallback != null) {
        Uri[] results = null;

        if (resultCode == RESULT_OK && data != null) {
            Uri uri = data.getData();
            if (uri != null) {
                results = new Uri[]{uri};
            }
        }

        filePathCallback.onReceiveValue(results);
        filePathCallback = null;
    }
}

@Override
public void onBackPressed() {
    if (webView != null && webView.canGoBack()) {
        webView.goBack();
    } else {
        super.onBackPressed();
    }
}
